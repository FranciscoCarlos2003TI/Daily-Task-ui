<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Task - Cadastro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo-icon">
                <img src="img/logo.svg" alt="Daily Task Logo">
            </div> 
            <h1>Crie sua conta</h1>
            <p>Organize seu dia de forma simples e prática</p>

            <form id="formCadastro">
                <div class="form-group">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" placeholder="Seu nome aqui" required>
                </div>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="exemplo@email.com" required>
                </div>
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <div class="input-with-icon">
                        <input type="password" id="senha" placeholder="••••••••" required>
                        <button type="button" class="btn-toggle-password" data-target="senha" title="Mostrar senha">
                            <img src="img/icon-eye.svg" alt="Visualizar senha">
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirmaSenha">Confirmar senha</label>
                    <input type="password" id="confirmaSenha" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary">Cadastrar</button>
            </form>

            <div class="auth-footer">
                Já tem uma conta? <a href="login.html">Faça login</a>
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Task - Perfil</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <div class="logo-icon">
                    <img src="img/logo.svg" alt="Daily Task Logo">
                </div>
                <div class="sidebar-logo-text">
                    <h1>Daily Task</h1>
                    <span>LEMBRETE DIÁRIO</span>
                </div>
            </div>
            <ul class="nav-menu">
                <li class="nav-item" onclick="window.location.href='index.html'">
                    <span class="nav-icon"><img src="img/icon-home.svg" alt=""></span>
                    Hoje
                </li>
                <li class="nav-item" onclick="window.location.href='historico.html'">
                    <span class="nav-icon"><img src="img/icon-history.svg" alt=""></span>
                    Histórico
                </li>
                <li class="nav-item active">
                    <span class="nav-icon"><img src="img/icon-user.svg" alt=""></span>
                    Perfil
                </li>
            </ul>
            <div class="nav-item nav-logout" onclick="window.location.href='login.html'">
                <span class="nav-icon"><img src="img/icon-logout.svg" alt=""></span>
                Sair
            </div>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <div style="margin-bottom: 2rem;">
                <h2 style="font-size: 1.75rem; font-weight: 700; color: var(--text-dark); margin-bottom: 0.5rem;">Meu Perfil</h2>
                <p style="color: var(--text-muted);">Gerencie suas informações pessoais</p>
            </div>

            <div class="task-list-container" style="max-width: 600px; padding: 2.25rem 2.5rem;">
                <!-- Foto de Perfil -->
                <div style="display: flex; align-items: center; gap: 1.5rem; margin-bottom: 2rem; padding-bottom: 2rem; border-bottom: 1px solid var(--border-color);">
                    <div style="width: 80px; height: 80px; border-radius: 50%; background: var(--primary-blue); display: flex; align-items: center; justify-content: center;">
                        <img src="img/icon-user.svg" alt="Perfil" style="width: 40px; height: 40px; filter: brightness(0) invert(1);">
                    </div>
                    <div>
                        <h3 id="profileName" style="font-size: 1.25rem; font-weight: 600; color: var(--text-dark); margin-bottom: 0.25rem;"></h3>
                        <p id="profileEmail" style="color: var(--text-muted); font-size: 0.9rem;"></p>
                    </div>
                </div>

                <form id="formPerfil">
                    <div class="form-group">
                        <label for="nomePerfil">Nome completo</label>
                        <input type="text" id="nomePerfil" required>
                    </div>

                    <div class="form-group">
                        <label for="emailPerfil">E-mail</label>
                        <input type="email" id="emailPerfil" required>
                    </div>

                    <div class="form-group">
                        <label for="senhaAtual">Senha atual</label>
                        <div class="input-with-icon">
                            <input type="password" id="senhaAtual" placeholder="••••••••">
                            <button type="button" class="btn-toggle-password" data-target="senhaAtual" title="Mostrar senha">
                                <img src="img/icon-eye.svg" alt="Visualizar senha">
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="novaSenha">Nova senha</label>
                        <div class="input-with-icon">
                            <input type="password" id="novaSenha" placeholder="••••••••">
                            <button type="button" class="btn-toggle-password" data-target="novaSenha" title="Mostrar senha">
                                <img src="img/icon-eye.svg" alt="Visualizar senha">
                            </button>
                        </div>
                    </div>

                    <div class="form-buttons">
                        <button type="button" class="btn-secondary" onclick="window.location.href='index.html'">Cancelar</button>
                        <button type="submit" class="btn-primary" style="width: auto; padding: 0.75rem 1.75rem;">Salvar Alterações</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script src="js/app.js"></script>
</body>
</html>

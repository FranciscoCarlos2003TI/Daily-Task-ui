<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Task - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo-icon">
                <img src="img/logo.svg" alt="Daily Task Logo">
            </div>
            <h1>Acesse sua conta</h1>
            <p>Gerencie seu tempo e realize seus objetivos</p>

            <form id="formLogin">
                <div class="form-group">
                    <label for="emailLogin">E-mail</label>
                    <input type="email" id="emailLogin" placeholder="exemplo@email.com" required>
                </div>
                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                        <label for="senhaLogin" style="margin-bottom: 0;">Senha</label>
                        <a href="#" style="font-size: 0.875rem; color: var(--primary-blue); text-decoration: none; font-weight: 500;">Esqueceu a senha?</a>
                    </div>
                    <div class="input-with-icon">
                        <input type="password" id="senhaLogin" placeholder="••••••••" required>
                        <button type="button" class="btn-toggle-password" data-target="senhaLogin" title="Mostrar senha">
                            <img src="img/icon-eye.svg" alt="Visualizar senha">
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Entrar</button>
            </form>

            <div class="auth-footer">
                Não tem conta? <a href="cadastro.html">Cadastre-se</a>
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>

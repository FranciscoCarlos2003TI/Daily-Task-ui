<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Task - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 11l3 3L22 4"></path>
                    <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                </svg>
            </div>
            <h1>Acesse sua conta</h1>
            <p>Gerencie seu tempo e realize seus objetivos</p>

            <form id="formLogin">
                <div class="form-group">
                    <label for="emailLogin">E-mail</label>
                    <input type="email" id="emailLogin" placeholder="exemplo@email.com" required>
                </div>
                <div class="form-group">
                    <div style="display: flex; justify-content: space-between;">
                        <label for="senhaLogin">Senha</label>
                        <a href="#" style="font-size: 0.875rem; color: var(--primary-blue); text-decoration: none;">Esqueceu a senha?</a>
                    </div>
                    <input type="password" id="senhaLogin" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary">Entrar</button>
            </form>

            <div class="auth-footer">
                Não tem conta? <a href="cadastro.html">Cadastre-se</a>
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Task - Nova Tarefa</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar Menu -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <div class="logo-icon">
                    <img src="img/logo.svg" alt="Daily Task Logo">
                </div>
                <div class="sidebar-logo-text">
                    <h1>Daily Task</h1>
                    <span>LEMBRETE DIÁRIO</span>
                </div>
            </div>
            <ul class="nav-menu">
                <li class="nav-item active" onclick="window.location.href='index.html'">
                    <span class="nav-icon"><img src="img/icon-home.svg" alt=""></span>
                    Hoje
                </li>
                <li class="nav-item" onclick="window.location.href='historico.html'">
                    <span class="nav-icon"><img src="img/icon-history.svg" alt=""></span>
                    Histórico
                </li>
                <li class="nav-item" onclick="window.location.href='perfil.html'">
                    <span class="nav-icon"><img src="img/icon-user.svg" alt=""></span>
                    Perfil
                </li>
            </ul>
            <div class="nav-item nav-logout" onclick="window.location.href='login.html'">
                <span class="nav-icon"><img src="img/icon-logout.svg" alt=""></span>
                Sair
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div style="margin-bottom: 2rem;">
                <div class="breadcrumb">
                    <a href="index.html">Tarefas</a>
                    <span class="separator">&gt;</span>
                    <span class="current">Nova Tarefa</span>
                </div>
                <h2 style="font-size: 1.75rem; font-weight: 700; color: var(--text-dark); margin-top: 0.25rem;">Nova Tarefa</h2>
            </div>

            <div class="task-list-container" style="max-width: 760px; padding: 2.25rem 2.5rem;">
                <form id="formNovaTarefa">
                    <div class="form-group">
                        <label for="tituloTarefa">Título da tarefa</label>
                        <input type="text" id="tituloTarefa" placeholder="Ex: Comprar leite e café" required>
                    </div>

                    <div class="form-group">
                        <label for="descricaoTarefa">Descrição (opcional)</label>
                        <textarea id="descricaoTarefa" rows="4" placeholder="Escreva observações adicionais sobre esta tarefa..."></textarea>
                    </div>
                    
                    <div style="display: flex; gap: 1.25rem; margin-bottom: 1.25rem;">
                        <div class="form-group" style="flex: 1; margin-bottom: 0;">
                            <label for="dataTarefa">Data</label>
                            <div class="input-with-icon has-leading-icon">
                                <span class="leading-icon">
                                    <img src="img/icon-calendar.svg" alt="">
                                </span>
                                <input type="text" id="dataTarefa" value="24/08/2026" placeholder="DD/MM/AAAA" required>
                            </div>
                        </div>
                        <div class="form-group" style="flex: 1; margin-bottom: 0;">
                            <label for="horaTarefa">Horário</label>
                            <div class="input-with-icon has-leading-icon">
                                <span class="leading-icon">
                                    <img src="img/icon-clock.svg" alt="">
                                </span>
                                <input type="text" id="horaTarefa" value="12:00" placeholder="HH:MM" required>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Prioridade</label>
                        <div class="priority-options">
                            <button type="button" class="priority-btn alta" data-priority="alta">
                                <span class="dot"></span> Alta
                            </button>
                            <button type="button" class="priority-btn media" data-priority="media">
                                <span class="dot"></span> Média
                            </button>
                            <button type="button" class="priority-btn baixa" data-priority="baixa">
                                <span class="dot"></span> Baixa
                            </button>
                        </div>
                        <input type="hidden" id="prioridadeTarefa" name="prioridade" value="alta">
                    </div>

                    <div class="reminder-row">
                        <div class="reminder-text">
                            <h4>Ativar lembrete por notificação</h4>
                            <p>Receba um aviso via notificação push no horário agendado</p>
                        </div>
                        <label class="switch">
                            <input type="checkbox" id="lembreteNotificacao" checked>
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="form-buttons">
                        <button type="button" class="btn-secondary" onclick="window.location.href='index.html'">Cancelar</button>
                        <button type="submit" class="btn-primary" style="width: auto; padding: 0.75rem 1.75rem;">Salvar Tarefa</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script src="js/app.js"></script>
</body>
</html>

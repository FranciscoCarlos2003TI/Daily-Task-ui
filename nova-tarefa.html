<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Task - Nova Tarefa</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <div class="logo-icon" style="width: 32px; height: 32px; margin-bottom: 0;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 11l3 3L22 4"></path>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                    </svg>
                </div>
                <span>Daily Task</span>
            </div>
            <ul class="nav-menu">
                <li class="nav-item active" onclick="window.location.href='index.html'">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                    Hoje
                </li>
                <li class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    Histórico
                </li>
                <li class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    Perfil
                </li>
            </ul>
            <div class="nav-item nav-logout" onclick="window.location.href='login.html'">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                Sair
            </div>
        </aside>

        <main class="main-content">
            <div style="margin-bottom: 2rem;">
                <span style="color: var(--text-muted); font-size: 0.875rem;">Tarefas &gt; <span style="color: var(--primary-blue);">Nova Tarefa</span></span>
                <h2 style="margin-top: 0.5rem;">Nova Tarefa</h2>
            </div>

            <div class="task-list-container" style="max-width: 700px;">
                <form id="formNovaTarefa">
                    <div class="form-group">
                        <label for="titulo">Título da tarefa</label>
                        <input type="text" id="titulo" placeholder="Ex: Comprar leite e café" required>
                    </div>
                    <div class="form-group">
                        <label for="descricao">Descrição (opcional)</label>
                        <textarea id="descricao" rows="4" placeholder="Escreva observações adicionais..."></textarea>
                    </div>
                    
                    <div style="display: flex; gap: 1rem;">
                        <div class="form-group" style="flex: 1;">
                            <label for="data">Data</label>
                            <input type="date" id="data" required>
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label for="horario">Horário</label>
                            <input type="time" id="horario" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="prioridade">Prioridade</label>
                        <select id="prioridade">
                            <option value="baixa">Baixa</option>
                            <option value="media" selected>Média</option>
                            <option value="alta">Alta</option>
                        </select>
                    </div>

                    <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
                        <button type="button" onclick="window.location.href='index.html'" style="padding: 0.75rem 1.5rem; background: var(--white); border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; font-weight: 500;">Cancelar</button>
                        <button type="submit" class="btn-primary" style="width: auto; padding: 0.75rem 1.5rem;">Salvar Tarefa</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Task - Editar Tarefa</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <div class="logo-icon">
                    <img src="img/logo.svg" alt="Daily Task Logo">
                </div>
                <div class="sidebar-logo-text">
                    <h1>Daily Task</h1>
                    <span>LEMBRETE DIÁRIO</span>
                </div>
            </div>
            <ul class="nav-menu">
                <li class="nav-item" onclick="window.location.href='index.html'">
                    <span class="nav-icon"><img src="img/icon-home.svg" alt=""></span>
                    Hoje
                </li>
                <li class="nav-item" onclick="window.location.href='historico.html'">
                    <span class="nav-icon"><img src="img/icon-history.svg" alt=""></span>
                    Histórico
                </li>
                <li class="nav-item" onclick="window.location.href='perfil.html'">
                    <span class="nav-icon"><img src="img/icon-user.svg" alt=""></span>
                    Perfil
                </li>
            </ul>
            <div class="nav-item nav-logout" onclick="window.location.href='login.html'">
                <span class="nav-icon"><img src="img/icon-logout.svg" alt=""></span>
                Sair
            </div>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <div style="margin-bottom: 2rem;">
                <div class="breadcrumb">
                    <a href="index.html">Tarefas</a>
                    <span class="separator">&gt;</span>
                    <span class="current">Editar Tarefa</span>
                </div>
                <h2 style="font-size: 1.75rem; font-weight: 700; color: var(--text-dark); margin-top: 0.25rem;">Editar Tarefa</h2>
            </div>

            <div class="task-list-container" style="max-width: 760px; padding: 2.25rem 2.5rem;">
                <form id="formEditarTarefa">
                    <div class="form-group">
                        <label>Título da tarefa</label>
                        <input type="text" value="Reunião de Alinhamento" required style="border-color: var(--primary-blue);">
                    </div>
                    
                    <div class="form-group">
                        <label>Descrição (opcional)</label>
                        <textarea rows="4" style="width: 100%; border: 1px solid var(--border-color); border-radius: 8px; padding: 0.75rem;">Discutir metas da sprint de marketing e ajustar o backlog do roadmap.</textarea>
                    </div>
                    
                    <div style="display: flex; gap: 1.25rem; margin-bottom: 1.25rem;">
                        <div class="form-group" style="flex: 1; margin-bottom: 0;">
                            <label>Data</label>
                            <div class="input-with-icon has-leading-icon">
                                <span class="leading-icon">
                                    <img src="img/icon-calendar.svg" alt="">
                                </span>
                                <input type="text" value="20/08/2026" required>
                            </div>
                        </div>
                        <div class="form-group" style="flex: 1; margin-bottom: 0;">
                            <label>Horário</label>
                            <div class="input-with-icon has-leading-icon">
                                <span class="leading-icon">
                                    <img src="img/icon-clock.svg" alt="">
                                </span>
                                <input type="text" value="10:00" required>
                            </div>
                        </div>
                    </div>

                    <!-- Toggle de Lembrete -->
                    <div class="reminder-row">
                        <div class="reminder-text">
                            <h4>Ativar lembrete por notificação</h4>
                            <p>Receba um aviso via notificação push no horário agendado</p>
                        </div>
                        <label class="switch">
                            <input type="checkbox" checked>
                            <span class="slider"></span>
                        </label>
                    </div>

                    <!-- Botões de Ação -->
                    <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 1.5rem;">
                        <button type="button" class="btn-danger-outline">Excluir Tarefa</button>
                        
                        <div class="form-buttons" style="margin-top: 0;">
                            <button type="button" class="btn-secondary" onclick="window.location.href='index.html'">Cancelar</button>
                            <button type="submit" class="btn-primary" style="width: auto; padding: 0.75rem 1.75rem;">Salvar Alterações</button>
                        </div>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
